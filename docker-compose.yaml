services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-meal_planning}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mp
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_ENHANCED_COOKIE_SECURITY: "False"
    ports:
      - "8080:80"
    networks:
      - mp
    depends_on:
      - postgres

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["app"]
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-meal_planning}
      LLM_API_KEY: ${LLM_API_KEY:-}
      USDA_API_KEY: ${USDA_API_KEY:-}
      LOG_FORMAT: json
    volumes:
      - ./config:/app/config:ro
      - ./recipes_html:/app/recipes_html:ro
      - ./data:/app/data
      - ./reports:/app/reports
    networks:
      - mp
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

networks:
  mp:
