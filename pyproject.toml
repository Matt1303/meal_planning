[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meal-planner"
version = "0.2.0"
description = "Plant-based weekly meal planner: ingest, parse, enrich, optimise."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Matt Smith" }]
dependencies = [
  "pandas>=2.2",
  "SQLAlchemy>=2.0",
  "psycopg2-binary>=2.9",
  "alembic>=1.13",
  "beautifulsoup4>=4.12",
  "quantulum3[classifier]>=0.9",
  "rapidfuzz>=3.10",
  "pyyaml>=6.0",
  "requests>=2.32",
  "openpyxl>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "structlog>=24.1",
  "typer>=0.12",
  "pyomo>=6.8",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "syrupy>=4.6",
  "responses>=0.25",
  "testcontainers[postgres]>=4.7",
  "docker>=7.1",
  "pre-commit>=3.7",
  "types-PyYAML",
  "types-requests",
  "pandas-stubs",
]
report = [
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "python-docx>=1.1",
  "jinja2>=3.1",
]
llm-openai = ["openai>=1.50"]
llm-anthropic = ["anthropic>=0.70"]
orchestrate = ["prefect>=2.16,<3", "griffe<0.40"]
serve = ["fastapi>=0.110", "uvicorn>=0.30"]
ui = ["streamlit>=1.40", "plotly>=5.20"]

[project.scripts]
meal-planner = "meal_planner.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/meal_planner"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "180 recipes", "archive", "data_pgadmin"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "PL", "C4", "RUF"]
ignore = [
  "PLR0913",
  "PLR2004",
  "PLR0912",
  "PLR0915",
  "PLR0911",
  "PLR0917",
  "B008",
  "E501",
  "RUF001",
  "RUF002",
  "RUF003",
  "RUF012",
  "PLC0415",
  "B007",
  "C416",
  "SIM102",
  "SIM105",
  "SIM110",
  "PLR1714",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "F401", "B007"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = false
exclude = [".venv/", "archive/", "180 recipes/", "tests/fixtures/"]

[[tool.mypy.overrides]]
module = [
  "pyomo.*",
  "quantulum3.*",
  "rapidfuzz.*",
  "bs4.*",
  "openpyxl.*",
  "matplotlib.*",
  "seaborn.*",
  "docx.*",
  "testcontainers.*",
  "responses.*",
  "prefect.*",
  "fastapi.*",
  "uvicorn.*",
  "plotly.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["meal_planner.serve"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "unit: fast unit tests with no external deps",
  "integration: tests requiring a Postgres container",
  "slow: tests that take >1s",
]
filterwarnings = [
  "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/meal_planner"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
fail_under = 0
