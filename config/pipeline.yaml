sources:
  local_html:
    path: "recipes_html/Recipes"
    selectors:
      title: "h1"
      ingredient_lines: "div.ingredients.text p.line"
      category: "p.categories"
      rating: "p.rating"
      servings: "span[itemprop=recipeYield]"
      difficulty: "span[itemprop=difficulty]"

parse:
  food_list_paths:
    - "config/food_list_canonical.txt"
  synonyms_path: "config/ingredient_synonyms.csv"
  unit_grams_path: "config/unit_grams.csv"
  density_path: "config/density_g_per_ml.csv"
  non_plant_terms_path: "config/non_plant_terms.yaml"
  fuzzy_min_score: 0.8
  llm_threshold: 0.7

meal_types:
  - breakfast
  - lunch
  - dinner
  - snack

portion_sizes:
  Beans: 80
  Berries: 80
  Other Fruits: 80
  Cruciferous Vegetables: 80
  Greens: 80
  Other Vegetables: 80
  Flaxseeds or Linseeds: 10
  Nuts and Seeds: 30
  Herbs and Spices: 5
  Whole Grains: 80

daily_dozen_targets:
  Beans: 3
  Berries: 1
  Other Fruits: 3
  Cruciferous Vegetables: 1
  Greens: 2
  Other Vegetables: 2
  Flaxseeds or Linseeds: 1
  Nuts and Seeds: 1
  Herbs and Spices: 1
  Whole Grains: 3

# Post-solve gap-fillers shown as guaranteed "Top-up" snacks when a person's
# day falls short. Whey is taken with water only (no other ingredients). Each
# fruit counts as grams/portion_size servings toward its Daily Dozen category.
topup:
  enabled: true
  whey_label: "Whey protein shake (water)"
  whey_scoop_grams: 30
  whey_kcal: 114
  whey_protein_g: 22
  whey_fat_g: 1.8
  whey_carbs_g: 2.7
  whey_fiber_g: 0
  max_whey_scoops: 6
  fruits:
    - {name: "Mixed berries", grams: 80, food_group: "Berries", emoji: "🫐", kcal: 40, protein_g: 0.6, fiber_g: 2.0, fat_g: 0.3, carbs_g: 9.0}
    - {name: "Banana", grams: 120, food_group: "Other Fruits", emoji: "🍌", kcal: 107, protein_g: 1.3, fiber_g: 3.1, fat_g: 0.4, carbs_g: 27.0}
    - {name: "Apple", grams: 150, food_group: "Other Fruits", emoji: "🍎", kcal: 78, protein_g: 0.6, fiber_g: 3.6, fat_g: 0.3, carbs_g: 21.0}
    - {name: "Orange", grams: 130, food_group: "Other Fruits", emoji: "🍊", kcal: 62, protein_g: 1.2, fiber_g: 3.1, fat_g: 0.2, carbs_g: 16.0}
    - {name: "Pear", grams: 150, food_group: "Other Fruits", emoji: "🍐", kcal: 85, protein_g: 0.7, fiber_g: 4.6, fat_g: 0.2, carbs_g: 23.0}

nutrition:
  cofid_path: "data/cofid.xlsx"
  cofid_url: ""
  usda_api_key: ""
  coverage_min_ratio: 0.6

llm:
  provider: "anthropic"
  model: "claude-sonnet-4-6"
  api_key: ""
  batch_size: 5

optimizer:
  min_rating: 3
  rating_weight: 1.0
  diversity_weight: 1.0
  recency_weight: 0.8
  slack_weight: 5.0
  recency_half_life_days: 30
  calories_daily_min: 1800
  calories_daily_max: 2400
  fiber_daily_min: 30
  snack_optional: false
  max_snacks_per_day: 3
  snack_category_limits:
    smoothie: 1
  max_recipe_repeats: 2
  solver_time_limit: 300
  solver_mip_gap: 0.05
  planning_horizon_days: 7
  # Weekly calorie/fibre caps disabled: the per-profile daily targets in the
  # household block below drive the plan (the weekly caps were a single-user
  # default and would fight two very different daily targets).
  calories_weekly_min: null
  calories_weekly_max: null
  fiber_weekly_min: null
  weekly_group_portions_min: {}
  include_non_plant: false
  # Per-person serving sizes that override the shared per-serving amount for
  # rice. Matt eats 400 g cooked rice per meal, Ellie 200 g. Only applies to
  # no-quantity ("to serve") rice lines (estimated_only); recipe-specified rice
  # weights are left as-is. value_as values these cooked-weight portions with
  # cooked-rice calories (the dry rice canonicals would over-count ~2.7x).
  per_person_portions:
    - canonicals:
        [rice, white rice, brown rice, wholegrain rice, basmati rice, jasmine rice, sushi rice]
      value_as: cooked rice
      estimated_only: true
      grams: {matt: 400, ellie: 200}

household:
  # When non-empty, the optimiser solves for the listed profiles jointly:
  # meal types listed in shared_meal_types are picked once (same recipe for
  # both users on a day); other meal types are picked per profile.
  # Leave profiles: [] to run in single-user mode using optimizer.* targets.
  profiles:
    - name: matt
      display_name: Matt
      # Calorie target 3300/day (±200 band so the solver has room).
      calories_daily_min: 3100
      calories_daily_max: 3500
      protein_daily_min: 190
      fiber_daily_min: 30
      fixed_meals:
        breakfast: "Matt Breakfast Smoothie"
    - name: ellie
      display_name: Ellie
      # Calorie target 1500/day (±150 band).
      calories_daily_min: 1350
      calories_daily_max: 1650
      protein_daily_min: 100
      fiber_daily_min: 25
  shared_meal_types:
    - lunch
    - dinner
